name: khiratna_frontend
description: "Khiratna - Smart Agriculture Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^16.0.0
  google_fonts: ^6.3.0
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  carousel_slider: ^5.0.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App Icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/khiratna_logo_app.png
    - assets/khiratna_logo.png

flutter_launcher_icons:
  android: true
  ios: true

  web:
    generate: true

  image_path: "assets/khiratna_logo_app.png"